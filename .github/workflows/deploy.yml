name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  # Lar deg kjøre deployen manuelt fra Actions-fanen.
  workflow_dispatch:

# Rettighetene GITHUB_TOKEN trenger for å publisere til Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Én deploy om gangen. Kø, men ikke avbryt en pågående publisering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bygg statisk eksport
        env:
          # Siden serveres fra https://techsquad-start.github.io/PraksisProsjekt/
          NEXT_PUBLIC_BASE_PATH: /PraksisProsjekt
        run: pnpm build

      # Uten denne dropper GitHub Pages mapper som starter med _ (f.eks. _next).
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
